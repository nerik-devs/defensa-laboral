# nginx server config for the Astro static site.
# Loaded as /etc/nginx/conf.d/default.conf inside the nginx:alpine image.

server {
    # nginx listens on 80 inside the container; Coolify's proxy maps the
    # public domain (and TLS) to it.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_types text/html text/css application/javascript application/json
               image/svg+xml text/plain;
    gzip_min_length 1024;

    # --- Cache policy ------------------------------------------------------
    # Astro fingerprints everything under /_astro/ (hash in the filename),
    # so those files can be cached "forever": a new deploy produces new names.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must always revalidate so a new deploy is visible immediately.
    location / {
        add_header Cache-Control "no-cache";
        # Security headers (the site sets none elsewhere; S12 in the
        # improvement plan).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html =404;
    }

    # robots.txt / sitemap are tiny; default handling is fine, listed here
    # only to make their existence explicit.
    location = /robots.txt  { try_files $uri =404; }
}
