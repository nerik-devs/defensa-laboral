name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck (astro check)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (astro build)
        run: npm run build
        env:
          PUBLIC_SINACOL_SERVER_URL: https://ci.invalid
